<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>REVA Three.js WebGL Single-Technique Bench (RevaCAD Kit)</title>
  <script src="./three.min.js"></script>
  <script src="./threejs_schematic.js"></script>
</head>
<body>
  <script>
    (function () {
      const ctx = RevaCAD.boot({
        headerNum: 1,
        headerTitle: "Technique Schematic Bench",
        subtitle: "Clay/CAD geometry first — replace starter block with researched mechanism",
      });
      const base = ctx.addMesh(ctx.scene, new THREE.BoxGeometry(3.2, 0.3, 3.2), ctx.clay(RevaCAD.PALETTE.board), 0, 0.15, 0, false);
      const block = ctx.addMesh(ctx.scene, new THREE.BoxGeometry(1.1, 1.2, 1.1), ctx.clay(RevaCAD.PALETTE.ok), 0, 0.9, 0);

      window.renderAt = function (timeSec) {
        ctx.hud.clear();
        block.rotation.y = timeSec * 0.5;
        ctx.camera.updateMatrixWorld();
        ctx.renderer.render(ctx.scene, ctx.camera);
        ctx.hud.chip(ctx.V(0, 1.5, 0), `t=${timeSec}s schematic`, "blue", 0, -90, true);
      };

      window.renderAt(ctx.tInit);
      document.body.dataset.ready = "1";
    })();
  </script>
</body>
</html>
