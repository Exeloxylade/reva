<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>REVA HyperFrames 2D Starter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e9e8e6; font-family: sans-serif; }
    .stage { position: relative; width: 100%; height: 100%; padding: 80px; }
    .card {
      width: 680px; height: 420px; background: #ffffff; border: 3px solid #1c1c1c;
      box-shadow: 10px 10px 0 #8b1a2b; padding: 36px; opacity: 0; transform: translateY(24px);
    }
    .title { font-size: 48px; font-weight: 700; color: #1c1c1c; }
    .sub { margin-top: 16px; font-size: 26px; color: #555555; }
  </style>
</head>
<body>
  <div class="stage" data-duration="4">
    <div class="card" id="card">
      <div class="title">Technique Test Spike</div>
      <div class="sub">Replace with measured px coordinates and fonts from grid_*.png</div>
    </div>
  </div>
  <script>
    // HyperFrames / GSAP hook: drive opacity/transform by frame time t.
    window.__setTime = (t) => {
      const p = Math.min(1, Math.max(0, t / 0.45));
      const el = document.getElementById("card");
      el.style.opacity = String(p);
      el.style.transform = `translateY(${(1 - p) * 24}px)`;
    };
    window.__setTime(0.45);
  </script>
</body>
</html>
