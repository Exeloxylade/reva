<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>REVA HyperFrames 2D Starter (Schematic First)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #eef3f7; font-family: "Segoe UI", Arial, sans-serif; }
    .stage { position: relative; width: 100%; height: 100%; padding: 64px; display: flex; align-items: center; justify-content: center; }
    .card {
      width: 82%; max-width: 880px; background: #ffffff; border: 4px solid #1e293b; border-radius: 16px;
      box-shadow: 12px 12px 0 #1d4ed8; padding: 40px; opacity: 0; transform: translateY(24px);
    }
    .title { font-size: 44px; font-weight: 800; color: #0f172a; }
    .sub { margin-top: 16px; font-size: 26px; color: #475569; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="stage" data-duration="4">
    <div class="card" id="card">
      <div class="title" id="title">Technique Test Spike</div>
      <div class="sub">Clean schematic CAD layout driven by window.__setTime(t)</div>
    </div>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const tInit = parseFloat(qs.get("t") || "0.45") || 0;
    window.__setTime = (t) => {
      const p = Math.min(1, Math.max(0, t / 0.45));
      const el = document.getElementById("card");
      el.style.opacity = String(0.15 + 0.85 * p);
      el.style.transform = `translateY(${(1 - p) * 24}px)`;
      document.getElementById("title").textContent = `Schematic Diagram (t=${Number(t).toFixed(2)}s)`;
    };
    window.__setTime(tInit);
    document.body.dataset.ready = "1";
  </script>
</body>
</html>
